pythonVersion: 3.12.3

services:
  - type: web
    name: codex-os-runtime-service
    env: python3
    plan: starter
    region: oregon
    pythonVersion: 3.12.3
    startCommand: "cd service && uvicorn main:app --host 0.0.0.0 --port 10000"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
    healthCheckPath: "/health"
    runtime: python3
