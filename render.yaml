pythonVersion: 3.12.3

services:
  - type: web
    name: codex-os-runtime-service
    env: python3
    plan: starter
    region: oregon
    pythonVersion: 3.12.3
    startCommand: "python service/codex_os_service_launcher.py"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
    healthCheckPath: "/os_boot"
    runtime: python3
