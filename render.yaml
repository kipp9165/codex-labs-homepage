services:
  - type: web
    name: codex-labs-homepage
    env: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: BASEROW_API_KEY
        sync: false
      - key: BASEROW_TABLE_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PORT
        value: 10000
