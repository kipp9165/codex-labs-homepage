services:
  - type: web
    name: codex-qa-backend
    env: node
    plan: free
    region: oregon

    buildCommand: |
      cd backend
      npm install

    startCommand: |
      cd backend
      node server.js

    envVars:
      - key: PORT
        value: 10000
      - key: BASEROW_API_KEY
        sync: false
      - key: BASEROW_TABLE_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
