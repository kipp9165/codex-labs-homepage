services:
  - type: static_site
    name: codex-labs-site
    env: static
    publishDir: public
    buildCommand: ""

  - type: web
    name: codex-labs-webhook
    env: node
    rootDir: webhook
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
