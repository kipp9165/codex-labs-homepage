services:
  - type: web
    name: codex-os-runtime-service
    env: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python service/codex_os_service_launcher.py"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: "/os_boot"
    runtime: python3
