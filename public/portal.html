<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal — Codex Labs</title>
  <meta name="description" content="Manage your Codex Labs licenses and access.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-title" href="index.html">Codex Labs</a>
      <div class="site-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="portal.html">Portal</a>
        <a href="verify.html">Verify</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="panel">
      <section>
        <h1>Customer Portal</h1>
        <p>Enter your email address to look up your licenses and manage your account.</p>
        <div id="status"></div>

        <form id="portal-form" style="margin-top:20px;">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">Look Up My Account</button>
        </form>

        <div id="result" style="margin-top:24px;"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div>© 2026 Codex Labs · Lakeville, CT</div>
  </footer>

  <script type="module">
    import { showAlert, escapeHtml } from './app.js';

    const form = document.getElementById('portal-form');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Looking up…';
      status.innerHTML = '';
      result.innerHTML = '';

      try {
        const res = await fetch('/api/portal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok) {
          const licenses = body.licenses ?? [];
          if (!licenses.length) {
            showAlert(result, 'info', 'No licenses found for this email address.');
          } else {
            result.innerHTML = `
              <h2 style="margin-bottom:16px;">Your Licenses</h2>
              ${licenses.map(lic => `
                <div class="product-card" style="margin-bottom:16px;">
                  <h3>${escapeHtml(lic.product ?? 'Unknown Product')}</h3>
                  <p>Key: <code>${escapeHtml(lic.license_key ?? '')}</code></p>
                  ${lic.status ? `<p>Status: <strong>${escapeHtml(lic.status)}</strong></p>` : ''}
                  ${lic.expires_at ? `<p>Expires: ${escapeHtml(lic.expires_at)}</p>` : ''}
                </div>`).join('')}`;
          }
        } else {
          showAlert(result, 'error', body.error ?? `Request failed (${res.status}).`);
        }
      } catch (err) {
        showAlert(status, 'error', `Network error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Look Up My Account';
      }
    });
  </script>
</body>
</html>
