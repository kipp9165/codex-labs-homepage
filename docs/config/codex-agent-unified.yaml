codex_agent:
  version: "1.0"
  substrate: "Codex Labs OS - Structural Layer"
  invariants:
    - "No bypass of governance layer"
    - "No reinterpretation of authority"
    - "No mutation without artifact chain"
    - "No execution without human approval"
    - "Diagnostics are non-authoritative"

  artifact_chain:
    sequence:
      - A0: "Intent Artifact"
      - A1: "Clarity Artifact"
      - A2: "Governance Artifact"
      - A3: "Human Approval Artifact"
      - A4: "Execution Artifact"
      - A5: "Diagnostic Artifact"
    rules:
      - "Each artifact must reference hash_prev"
      - "Each artifact must be canonically serialized"
      - "Each artifact must be version-bound"
      - "Chain-head commitment required at A5"

  authority_surface:
    human_primary:
      id: "HUMAN-PRIMARY"
      version: "v12"
      admissibility:
        - "Explicit approval required"
        - "Scope must match governance"
        - "Signature binds hash(A2)"
        - "No expired or invalid signatures"

  refusal_paths:
    inadmissible_intent:
      chain:
        - "A0-Intent"
        - "A1-Clarity"
        - "A2-Refusal"
        - "A3-Refusal-Receipt"
        - "A4-Diagnostic-Refusal"
      enforcement:
        - "No bind"
        - "No mutation"
        - "No alternate route"
        - "No retry inheriting denied standing"

  execution_layer:
    deterministic_paths:
      - id: "deterministic-path-17"
        invariants:
          - "budget_increase_applied only under approved scope"
          - "no mutation outside allowed boundary"
          - "execution never writes governance"
        constraints:
          - "execution must reference A3"
          - "execution must preserve invariants"
          - "execution must produce A4"

  diagnostics:
    non_authoritative: true
    rules:
      - "Diagnostics observe, never authorize"
      - "coherence_check cannot influence A2 or A3"
      - "drift_indicators must be logged"
      - "structural_receipts must be preserved"

  ledger:
    integrity:
      - "hash(A5) anchors chain"
      - "tamper-evident continuity"
      - "public registry entry required"
      - "refusal receipts must be immutable"

  founder_protocol:
    onboarding:
      - "F0: Discovery"
      - "F1: Contact"
      - "F2: Structural Exchange"
      - "F3: Governance Evaluation"
      - "F4: Founder Approval"
      - "F5: Portfolio Entry"
    refusal:
      - "F3-Refusal"
      - "F4-Refusal"
      - "F5-Refusal-Diagnostic"

  motto:
    - "Integrity is not optional."
    - "Coherence is not negotiable."
    - "Governance is human."
